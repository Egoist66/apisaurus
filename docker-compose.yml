services:
  postgres:
    image: postgres:16-alpine
    container_name: apisaurus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apisaurus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - apisaurus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apisaurus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apisaurus-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apisaurus?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-long-random-secret}
    ports:
      - "3000:3000"
    command: sh -c "pnpm prisma:deploy && node server.js"

volumes:
  apisaurus_postgres_data:
